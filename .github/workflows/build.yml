name: Build Android 10 Kernel with WLAN
on: push

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取内核源码
        uses: actions/checkout@v4

      - name: 恢复 Makefile 原版
        run: |
          curl -L -o Makefile \
            https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/bomb-q-oss/Makefile
          sed -n '364,370p' Makefile | cat -A

      - name: 安装依赖和工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc libelf-dev libssl-dev make zip wget git python3

          wget -q https://repo.anaconda.com/miniconda/Miniconda2-latest-Linux-x86_64.sh -O miniconda2.sh
          bash miniconda2.sh -b -p $HOME/miniconda2
          export PATH="$HOME/miniconda2/bin:$PATH"
          python --version

          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-9.0.1/clang+llvm-9.0.1-x86_64-linux-gnu-ubuntu-16.04.tar.xz
          tar -xf clang+llvm-9.0.1-x86_64-linux-gnu-ubuntu-16.04.tar.xz -C /opt
          mv /opt/clang+llvm-9.0.1-x86_64-linux-gnu-* /opt/clang9

          wget -q -O arm64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-10.0.0_r47.tar.gz
          mkdir -p /opt/gcc-arm64 && tar -xf arm64.tar.gz -C /opt/gcc-arm64
          wget -q -O arm32.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-10.0.0_r47.tar.gz
          mkdir -p /opt/gcc-arm32 && tar -xf arm32.tar.gz -C /opt/gcc-arm32

      - name: 修复 dtc yylloc 多重定义
        run: |
          sed -i 's|-std=gnu89 $(HOST_LFS_CFLAGS)$|-std=gnu89 $(HOST_LFS_CFLAGS) -fcommon|' Makefile
          grep -n "^HOSTCFLAGS " Makefile

      - name: 创建触摸屏固件占位文件
        run: |
          mkdir -p drivers/input/touchscreen/focaltech_touch/include/firmware
          mkdir -p drivers/input/touchscreen/focaltech_touch/include/pramboot
          touch drivers/input/touchscreen/focaltech_touch/include/firmware/fw_ft3518_j7.i
          touch drivers/input/touchscreen/focaltech_touch/include/firmware/fw_sample.i
          touch drivers/input/touchscreen/focaltech_touch/include/pramboot/FT8719_Pramboot_V0.5_20171221.i

      - name: 强制 DrvGen.py 使用 Python 2
        run: |
          sed -i "1s|^#!.*|#!$HOME/miniconda2/bin/python|" tools/dct/DrvGen.py
          sed -i 's|\$(srctree)/../tools/dct/DrvGen.py|python $(srctree)/tools/dct/DrvGen.py|g' scripts/drvgen/drvgen.mk
          sed -i 's|\.\./tools/dct/DrvGen.py|python ../tools/dct/DrvGen.py|g' scripts/drvgen/drvgen.mk

      - name: 拉取 MTK 驱动模块 (bomb-q-oss)
        run: |
          mkdir -p vendor/mediatek
          git clone --depth=1 --branch bomb-q-oss \
            https://github.com/MiCode/MTK_kernel_modules.git \
            vendor/mediatek/kernel_modules

      - name: 修改 WLAN 驱动 Makefile 的 TOP
        run: |
          for f in \
            vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m/Makefile \
            vendor/mediatek/kernel_modules/connectivity/wlan/adaptor/Makefile; do
            echo "=== $f ==="
            grep -n "^TOP" "$f" || echo "  (no TOP)"
            sed -i 's|TOP[[:space:]]*:=[[:space:]]*\$(srctree)/\.\.|TOP := $(srctree)/|' "$f"
            grep -n "^TOP" "$f" || echo "  (still no TOP)"
          done

      - name: 修改 connectivity/Makefile 的 WLAN 部分
        run: |
          CONN_MK="drivers/misc/mediatek/connectivity/Makefile"
          cp "$CONN_MK" "${CONN_MK}.bak"

          sed -i 's|\$(srctree)/\.\./|\$(srctree)/|g' "$CONN_MK"

          sed -i 's|ABS_PATH_TO_WMT_DRV[[:space:]]*=[[:space:]]*\$(srctree)/\$(PATH_TO_WMT_DRV)|ABS_PATH_TO_WMT_DRV       = \$(abspath \$(srctree)/\$(PATH_TO_WMT_DRV))|' "$CONN_MK"
          sed -i 's|ABS_PATH_TO_WLAN_CHR_DRV[[:space:]]*=[[:space:]]*\$(srctree)/\$(PATH_TO_WLAN_CHR_DRV)|ABS_PATH_TO_WLAN_CHR_DRV  = \$(abspath \$(srctree)/\$(PATH_TO_WLAN_CHR_DRV))|' "$CONN_MK"
          sed -i 's|ABS_PATH_TO_WLAN_DRV[[:space:]]*=[[:space:]]*\$(srctree)/\$(PATH_TO_WLAN_DRV)|ABS_PATH_TO_WLAN_DRV      = \$(abspath \$(srctree)/\$(PATH_TO_WLAN_DRV))|' "$CONN_MK"

          sed -i 's|\bunlink\b|rm -rf|g' "$CONN_MK"
          sed -i 's|\bln -s\b|ln -snf|g' "$CONN_MK"

          echo "=== 验证 WLAN 相关行 ==="
          grep -n -E "ABS_PATH_TO_(WMT|WLAN)|PATH_TO_(WMT|WLAN)" "$CONN_MK" | head -20

      - name: 创建 WLAN 软链接
        run: |
          for d in wmt_drv wmt_chrdev_wifi wlan_drv_gen4m; do
            rm -rf drivers/misc/mediatek/connectivity/$d
          done

          ln -snf "$(pwd)/vendor/mediatek/kernel_modules/connectivity/common" drivers/misc/mediatek/connectivity/wmt_drv
          ln -snf "$(pwd)/vendor/mediatek/kernel_modules/connectivity/wlan/adaptor" drivers/misc/mediatek/connectivity/wmt_chrdev_wifi
          ln -snf "$(pwd)/vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m" drivers/misc/mediatek/connectivity/wlan_drv_gen4m

          ls -la drivers/misc/mediatek/connectivity/ | grep "^l"

      - name: 查找并修复头文件路径
        run: |
          echo "=== 查找 connsys_coredump.h ==="
          find vendor/mediatek/kernel_modules/connectivity/ -name "connsys_coredump.h" 2>/dev/null
          echo "=== 查找 connsys_debug_utility.h ==="
          find vendor/mediatek/kernel_modules/connectivity/ -name "connsys_debug_utility.h" 2>/dev/null
          echo "=== conninfra 目录结构 ==="
          find vendor/mediatek/kernel_modules/connectivity/conninfra/ -type d | head -40

          INC1="\$(srctree)/vendor/mediatek/kernel_modules/connectivity/common/common_main/include"
          INC2="\$(srctree)/vendor/mediatek/kernel_modules/connectivity/common/common_main/linux/include"
          INC3="\$(srctree)/vendor/mediatek/kernel_modules/connectivity/common/core/include"

          ADAPTOR_MK="vendor/mediatek/kernel_modules/connectivity/wlan/adaptor/Makefile"
          for i in "$INC1" "$INC2" "$INC3"; do
            sed -i "1i ccflags-y += -I$i" "$ADAPTOR_MK"
          done

          GEN4M_MK="vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m/Makefile"
          for i in "$INC1" "$INC2" "$INC3"; do
            sed -i "1i ccflags-y += -I$i" "$GEN4M_MK"
          done

          echo "=== adaptor 前 10 行 ==="
          head -10 "$ADAPTOR_MK"
          echo "=== gen4m 前 10 行 ==="
          head -10 "$GEN4M_MK"
