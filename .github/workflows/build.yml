name: Build Android 10 Kernel for Redmi 10X 5G (WLAN/BT/GPS)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取内核源码
        uses: actions/checkout@v4

      - name: 恢复 Makefile 原版
        run: |
          curl -L -o Makefile \
            https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/bomb-q-oss/Makefile
          sed -n '364,370p' Makefile | cat -A

      - name: 安装依赖和工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc libelf-dev libssl-dev make zip wget git python3

          wget -q https://repo.anaconda.com/miniconda/Miniconda2-latest-Linux-x86_64.sh -O miniconda2.sh
          bash miniconda2.sh -b -p $HOME/miniconda2
          export PATH="$HOME/miniconda2/bin:$PATH"
          python --version

          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-9.0.1/clang+llvm-9.0.1-x86_64-linux-gnu-ubuntu-16.04.tar.xz
          tar -xf clang+llvm-9.0.1-x86_64-linux-gnu-ubuntu-16.04.tar.xz -C /opt
          mv /opt/clang+llvm-9.0.1-x86_64-linux-gnu-* /opt/clang9

          wget -q -O arm64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-10.0.0_r47.tar.gz
          mkdir -p /opt/gcc-arm64 && tar -xf arm64.tar.gz -C /opt/gcc-arm64
          wget -q -O arm32.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-10.0.0_r47.tar.gz
          mkdir -p /opt/gcc-arm32 && tar -xf arm32.tar.gz -C /opt/gcc-arm32

      - name: 修复 dtc yylloc 多重定义
        run: |
          grep -n "^HOSTCFLAGS " Makefile
          sed -i 's|-std=gnu89 $(HOST_LFS_CFLAGS)$|-std=gnu89 $(HOST_LFS_CFLAGS) -fcommon|' Makefile
          grep -n "^HOSTCFLAGS " Makefile

      - name: 创建触摸屏固件占位文件
        run: |
          mkdir -p drivers/input/touchscreen/focaltech_touch/include/firmware
          mkdir -p drivers/input/touchscreen/focaltech_touch/include/pramboot
          touch drivers/input/touchscreen/focaltech_touch/include/firmware/fw_ft3518_j7.i
          touch drivers/input/touchscreen/focaltech_touch/include/firmware/fw_sample.i
          touch drivers/input/touchscreen/focaltech_touch/include/pramboot/FT8719_Pramboot_V0.5_20171221.i

      - name: 强制 DrvGen.py 使用 Python 2
        run: |
          sed -i "1s|^#!.*|#!$HOME/miniconda2/bin/python|" tools/dct/DrvGen.py
          sed -i 's|\$(srctree)/../tools/dct/DrvGen.py|python $(srctree)/tools/dct/DrvGen.py|g' scripts/drvgen/drvgen.mk
          sed -i 's|\.\./tools/dct/DrvGen.py|python ../tools/dct/DrvGen.py|g' scripts/drvgen/drvgen.mk

      - name: 拉取 MTK 驱动模块
        run: |
          mkdir -p vendor/mediatek
          git clone --depth=1 --branch cezanne-r-oss \
            https://github.com/MiCode/MTK_kernel_modules.git \
            vendor/mediatek/kernel_modules

      - name: 修改驱动 Makefile 的 TOP 路径
        run: |
          for f in \
            vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m/Makefile \
            vendor/mediatek/kernel_modules/connectivity/wlan/adaptor/Makefile \
            vendor/mediatek/kernel_modules/connectivity/bt/mt66xx/legacy/Makefile \
            vendor/mediatek/kernel_modules/connectivity/fmradio/Makefile \
            vendor/mediatek/kernel_modules/connectivity/gps/Makefile; do
            echo "=== $f ==="
            grep -n "^TOP" "$f" || echo "  (no TOP)"
            sed -i 's|TOP[[:space:]]*:=[[:space:]]*\$(srctree)/\.\.|TOP := $(srctree)/|' "$f"
            grep -n "^TOP" "$f" || echo "  (still no TOP)"
          done

      - name: 修改 connectivity/Makefile (WLAN/BT/GPS)
        run: |
          CONN_MK="drivers/misc/mediatek/connectivity/Makefile"
          cp "$CONN_MK" "${CONN_MK}.bak"

          sed -i 's|\$(srctree)/\.\./|\$(srctree)/|g' "$CONN_MK"

          sed -i 's|ABS_PATH_TO_WMT_DRV[[:space:]]*=[[:space:]]*\$(srctree)/\$(PATH_TO_WMT_DRV)|ABS_PATH_TO_WMT_DRV       = \$(abspath \$(srctree)/\$(PATH_TO_WMT_DRV))|' "$CONN_MK"
          sed -i 's|ABS_PATH_TO_WLAN_CHR_DRV[[:space:]]*=[[:space:]]*\$(srctree)/\$(PATH_TO_WLAN_CHR_DRV)|ABS_PATH_TO_WLAN_CHR_DRV  = \$(abspath \$(srctree)/\$(PATH_TO_WLAN_CHR_DRV))|' "$CONN_MK"
          sed -i 's|ABS_PATH_TO_WLAN_DRV[[:space:]]*=[[:space:]]*\$(srctree)/\$(PATH_TO_WLAN_DRV)|ABS_PATH_TO_WLAN_DRV      = \$(abspath \$(srctree)/\$(PATH_TO_WLAN_DRV))|' "$CONN_MK"
          sed -i 's|ABS_PATH_TO_BT_DRV[[:space:]]*=[[:space:]]*\$(srctree)/\$(PATH_TO_BT_DRV)|ABS_PATH_TO_BT_DRV       = \$(abspath \$(srctree)/\$(PATH_TO_BT_DRV))|' "$CONN_MK"
          sed -i 's|ABS_PATH_TO_GPS_DRV[[:space:]]*=[[:space:]]*\$(srctree)/\$(PATH_TO_GPS_DRV)|ABS_PATH_TO_GPS_DRV      = \$(abspath \$(srctree)/\$(PATH_TO_GPS_DRV))|' "$CONN_MK"

          sed -i 's|\bunlink\b|rm -rf|g' "$CONN_MK"
          sed -i 's|\bln -s\b|ln -snf|g' "$CONN_MK"

          sed -i 's|^# For BT built-in mode start @{|For BT built-in mode start @{|' "$CONN_MK"

          python3 << 'PYEOF'
          path = "drivers/misc/mediatek/connectivity/Makefile"
          with open(path) as f:
              lines = f.readlines()
          in_bt = False
          out = []
          for line in lines:
              if 'For BT built-in mode start @{' in line and not line.strip().startswith('#'):
                  in_bt = True
                  out.append(line)
                  continue
              if '# @} For BT built-in mode end' in line:
                  in_bt = False
                  out.append(line)
                  continue
              if in_bt and line.startswith('# '):
                  out.append(line[2:])
              else:
                  out.append(line)
          with open(path, 'w') as f:
              f.writelines(out)
          PYEOF

          echo "=== 验证关键行 ==="
          grep -n -E "ABS_PATH_TO_(WMT|WLAN|BT|GPS)|PATH_TO_(WMT|WLAN|BT|GPS)" "$CONN_MK" | head -30
          echo "=== 验证 ln/rm ==="
          grep -n -E "ln -snf|rm -rf" "$CONN_MK" | head -10

      - name: 修改 GPS/BT 驱动为内建
        run: |
          sed -i 's/^obj-m += \$(MODULE_NAME)\.o/obj-y += $(MODULE_NAME).o/' vendor/mediatek/kernel_modules/connectivity/gps/Makefile
          grep -n "obj-" vendor/mediatek/kernel_modules/connectivity/gps/Makefile | head -5

          sed -i 's/^obj-m += \$(MODULE_NAME)\.o/obj-y += $(MODULE_NAME).o/' vendor/mediatek/kernel_modules/connectivity/bt/mt66xx/legacy/Makefile
          grep -n "obj-" vendor/mediatek/kernel_modules/connectivity/bt/mt66xx/legacy/Makefile | head -5

          sed -i 's/static void __exit gps_emi_mod_exit/static void gps_emi_mod_exit/' vendor/mediatek/kernel_modules/connectivity/gps/gps_emi.c
          sed -i 's/static void __exit gps_fw_log_exit/static void gps_fw_log_exit/' vendor/mediatek/kernel_modules/connectivity/gps/fw_log_gps.c

      - name: 创建 WLAN/BT/GPS 软链接
        run: |
          for d in wmt_drv wmt_chrdev_wifi wlan_drv_gen4m bt gps_drv; do
            rm -rf drivers/misc/mediatek/connectivity/$d
          done

          ln -snf "$(pwd)/vendor/mediatek/kernel_modules/connectivity/common" drivers/misc/mediatek/connectivity/wmt_drv
          ln -snf "$(pwd)/vendor/mediatek/kernel_modules/connectivity/wlan/adaptor" drivers/misc/mediatek/connectivity/wmt_chrdev_wifi
          ln -snf "$(pwd)/vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m" drivers/misc/mediatek/connectivity/wlan_drv_gen4m
          ln -snf "$(pwd)/vendor/mediatek/kernel_modules/connectivity/bt/mt66xx/legacy" drivers/misc/mediatek/connectivity/bt
          ln -snf "$(pwd)/vendor/mediatek/kernel_modules/connectivity/gps" drivers/misc/mediatek/connectivity/gps_drv

          ls -la drivers/misc/mediatek/connectivity/ | grep "^l"

      - name: 全局禁用 -Werror（解决 signal.h array-bounds）
        run: |
          grep -rl -- "-Werror" --include="Makefile" --include="*.mk" . | xargs sed -i 's/-Werror/-Wno-error/g' || true
          echo "=== 检查残留 -Werror ==="
          grep -rn -- "-Werror" --include="Makefile" --include="*.mk" . 2>/dev/null | head -10 || echo "无残留"

      - name: 修复 WLAN 驱动编译问题
        run: |
          # 1. gl_init.c 的 extern 声明（用 unsigned long 替代 phys_addr_t）
          GL_INIT="vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m/os/linux/gl_init.c"
          grep -n "gConEmiPhyBaseFinal\|kalSetEmiMpuProtection" "$GL_INIT" | head
          sed -i '1i extern unsigned long gConEmiPhyBaseFinal;\nextern unsigned long long gConEmiSizeFinal;\nextern void kalSetEmiMpuProtection(unsigned long emi_phy_base, int enable);\n' "$GL_INIT"
          head -5 "$GL_INIT"

          # 2. wmt_gpio.c 加 KERNEL_mtk_wcn_cmb_sdio_request_eirq 声明
          WMT_GPIO="vendor/mediatek/kernel_modules/connectivity/common/common_detect/wmt_gpio.c"
          sed -i '1i extern void KERNEL_mtk_wcn_cmb_sdio_request_eirq(void);\n' "$WMT_GPIO"
          head -5 "$WMT_GPIO"

      - name: 编译内核
        run: |
          export PATH="$HOME/miniconda2/bin:/opt/clang9/bin:/opt/gcc-arm64/bin:/opt/gcc-arm32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-androidkernel-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KCFLAGS="-Wno-error -Wno-self-assign"

          python --version

          make -j$(nproc) ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld O=out atom_user_defconfig

          scripts/config --file out/.config \
            --disable CONFIG_CC_STACKPROTECTOR_STRONG \
            --disable LTO_CLANG \
            --enable CONFIG_KALLSYMS_ALL \
            --enable CONFIG_NAMESPACES \
            --enable CONFIG_PID_NS \
            --enable CONFIG_UTS_NS \
            --enable CONFIG_IPC_NS \
            --enable CONFIG_SYSVIPC \
            --enable CONFIG_POSIX_MQUEUE \
            --enable CONFIG_SYSCTL \
            --enable CONFIG_SECCOMP \
            --enable CONFIG_SECCOMP_FILTER \
            --enable CONFIG_DEVTMPFS \
            --enable CONFIG_DEVTMPFS_MOUNT \
            --enable CONFIG_OVERLAY_FS \
            --enable CONFIG_NET_NS \
            --enable CONFIG_TUN \
            --enable CONFIG_VETH \
            --enable CONFIG_USER_NS \
            --enable CONFIG_CGROUPS \
            --enable CONFIG_CGROUP_DEVICE \
            --enable CONFIG_CGROUP_PIDS \
            --enable CONFIG_MEMCG \
            --enable CONFIG_CGROUP_SCHED \
            --enable CONFIG_FAIR_GROUP_SCHED \
            --enable CONFIG_CGROUP_FREEZER \
            --enable CONFIG_WLAN_DRV_BUILD_IN \
            --enable CONFIG_MTK_COMBO_BT \
            --enable CONFIG_MTK_COMBO_GPS \
            --enable CONFIG_MTK_COMBO_WIFI \
            --set-str CONFIG_MTK_COMBO_CHIP CONSYS_6873

          make -j$(nproc) ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld O=out olddefconfig

          echo "=== 验证配置 ==="
          grep -E "CONFIG_(PID_NS|UTS_NS|IPC_NS|SYSVIPC|DEVTMPFS|NET_NS|VETH|USER_NS|TUN|WLAN_DRV_BUILD_IN|MTK_COMBO_BT|MTK_COMBO_GPS|MTK_COMBO_WIFI|MTK_COMBO_CHIP)=" out/.config || true

          make -j$(nproc) ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld O=out CONFIG_WLAN_DRV_BUILD_IN=y

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Android10_Redmi10X5G_WLAN
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/mediatek/mt6873.dtb
