name: Build Android 10 Kernel for Redmi 10X 5G (WLAN/BT/GPS)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取内核源码
        uses: actions/checkout@v4

      - name: 恢复 Makefile 原版
        run: |
          curl -L -o Makefile \
            https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/bomb-q-oss/Makefile
          sed -n '364,370p' Makefile | cat -A

      - name: 安装依赖和工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc libelf-dev libssl-dev make zip wget git python3

          wget -q https://repo.anaconda.com/miniconda/Miniconda2-latest-Linux-x86_64.sh -O miniconda2.sh
          bash miniconda2.sh -b -p $HOME/miniconda2
          export PATH="$HOME/miniconda2/bin:$PATH"
          python --version

          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-9.0.1/clang+llvm-9.0.1-x86_64-linux-gnu-ubuntu-16.04.tar.xz
          tar -xf clang+llvm-9.0.1-x86_64-linux-gnu-ubuntu-16.04.tar.xz -C /opt
          mv /opt/clang+llvm-9.0.1-x86_64-linux-gnu-* /opt/clang9

          wget -q -O arm64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-10.0.0_r47.tar.gz
          mkdir -p /opt/gcc-arm64 && tar -xf arm64.tar.gz -C /opt/gcc-arm64
          wget -q -O arm32.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-10.0.0_r47.tar.gz
          mkdir -p /opt/gcc-arm32 && tar -xf arm32.tar.gz -C /opt/gcc-arm32

      - name: 修复 dtc yylloc 多重定义
        run: |
          grep -n "^HOSTCFLAGS " Makefile
          sed -i 's|-std=gnu89 $(HOST_LFS_CFLAGS)$|-std=gnu89 $(HOST_LFS_CFLAGS) -fcommon|' Makefile
          grep -n "^HOSTCFLAGS " Makefile

      - name: 创建触摸屏固件占位文件
        run: |
          mkdir -p drivers/input/touchscreen/focaltech_touch/include/firmware
          mkdir -p drivers/input/touchscreen/focaltech_touch/include/pramboot
          touch drivers/input/touchscreen/focaltech_touch/include/firmware/fw_ft3518_j7.i
          touch drivers/input/touchscreen/focaltech_touch/include/firmware/fw_sample.i
          touch drivers/input/touchscreen/focaltech_touch/include/pramboot/FT8719_Pramboot_V0.5_20171221.i

      - name: 强制 DrvGen.py 使用 Python 2
        run: |
          sed -i "1s|^#!.*|#!$HOME/miniconda2/bin/python|" tools/dct/DrvGen.py
          sed -i 's|\$(srctree)/../tools/dct/DrvGen.py|python $(srctree)/tools/dct/DrvGen.py|g' scripts/drvgen/drvgen.mk
          sed -i 's|\.\./tools/dct/DrvGen.py|python ../tools/dct/DrvGen.py|g' scripts/drvgen/drvgen.mk

      - name: 拉取 MTK 驱动模块 (bomb-q-oss)
        run: |
          mkdir -p vendor/mediatek
          git clone --depth=1 --branch bomb-q-oss \
            https://github.com/MiCode/MTK_kernel_modules.git \
            vendor/mediatek/kernel_modules
          echo "=== 检查目录结构 ==="
          ls -la vendor/mediatek/kernel_modules/connectivity/
          echo "=== wlan 目录 ==="
          ls -la vendor/mediatek/kernel_modules/connectivity/wlan/ 2>/dev/null || echo "无 wlan 目录"
          echo "=== 检查 gen4m ==="
          ls -la vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m/ 2>/dev/null | head -20 || echo "无 gen4m"

      - name: 编译内核
        run: |
          export PATH="$HOME/miniconda2/bin:/opt/clang9/bin:/opt/gcc-arm64/bin:/opt/gcc-arm32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-androidkernel-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KCFLAGS="-Wno-error -Wno-self-assign -Wno-unknown-warning-option -Wno-ignored-optimization-argument"

          python --version

          make -j$(nproc) ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld O=out atom_user_defconfig

          scripts/config --file out/.config \
            --disable CONFIG_CC_STACKPROTECTOR_STRONG \
            --disable LTO_CLANG \
            --enable CONFIG_KALLSYMS \
            --enable CONFIG_KALLSYMS_ALL \
            --enable CONFIG_NAMESPACES \
            --enable CONFIG_PID_NS \
            --enable CONFIG_UTS_NS \
            --enable CONFIG_IPC_NS \
            --enable CONFIG_SYSVIPC \
            --enable CONFIG_POSIX_MQUEUE \
            --enable CONFIG_SYSCTL \
            --enable CONFIG_SECCOMP \
            --enable CONFIG_SECCOMP_FILTER \
            --enable CONFIG_DEVTMPFS \
            --enable CONFIG_DEVTMPFS_MOUNT \
            --enable CONFIG_OVERLAY_FS \
            --enable CONFIG_NET_NS \
            --enable CONFIG_TUN \
            --enable CONFIG_VETH \
            --enable CONFIG_USER_NS \
            --enable CONFIG_CGROUPS \
            --enable CONFIG_CGROUP_DEVICE \
            --enable CONFIG_CGROUP_PIDS \
            --enable CONFIG_MEMCG \
            --enable CONFIG_CGROUP_SCHED \
            --enable CONFIG_FAIR_GROUP_SCHED \
            --enable CONFIG_CGROUP_FREEZER

          make -j$(nproc) ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld O=out olddefconfig

          echo "=== 验证配置 ==="
          grep -E "CONFIG_(PID_NS|UTS_NS|IPC_NS|SYSVIPC|DEVTMPFS|NET_NS|VETH|USER_NS|TUN|KALLSYMS_ALL)=" out/.config || true

          make -j$(nproc) ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld O=out

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Android10_Redmi10X5G
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/mediatek/mt6873.dtb
